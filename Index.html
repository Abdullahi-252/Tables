<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Marks Report</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #d9fcff;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
    }

    thead tr {
      background: #60a9e4;
    }

    thead th {
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    tbody tr:nth-child(even) {
      background: #f2f2f2;
    }

    tbody tr:nth-child(odd) {
      background: #ffffff;
    }
    tbody tr:hover {
      background: #cce5ff;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    tbody td {
      padding: 12px 16px;
      text-align: center;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
    }
    

    .btn-edit {
      background: #84e388;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 6px;
    }

    .btn-delete {
      background: #ec7f77;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-edit:hover { background: #188e2f; }
    .btn-delete:hover { background: #780404; }
  </style>
</head>
<body>

  <h2>Student Marks Report</h2>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>MATH</th>
        <th>ENGLISH</th>
        <th>SCIENCE</th>
        <th>BUTTON</th>
      </tr>
    </thead>

</body>
